# One entry per animated Billie, keyed by PNG stem. Boxes are [x, y, w, h] in
# the shipped PNG's pixels. After changing art or an entry, regenerate with:
#
#   uv run --with pillow python tools/animate.py build [stem ...]
#
# Effects (see tools/animate.py):
#   blink    eyes = dot eyes, or set open = true for white eyeballs. Optional
#            eyes_later blink in turn after a second stare.
#   flicker  box = a candle flame (orange outline, lighter core, dark wick).
#   steam    box = light wisps over darker art. Keep the cup or pie out of it.
#   glow     box + kind = "saber" (blue blade) or "candle" (dark cutouts that
#            light up, e.g. a jack-o'-lantern face).
#   twinkle  box = a dark glittery area that sparkles.
#   pulse    boxes = shapes on transparent background that beat like hearts.

